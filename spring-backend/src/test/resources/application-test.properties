spring.datasource.url=jdbc:h2:mem:keycloak-tests;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/library
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/realms/library/protocol/openid-connect/certs
app.seed-books=false
app.kafka.enabled=false
logging.level.root=WARN
logging.level.org.springframework=ERROR
logging.level.org.springframework.security=ERROR
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
