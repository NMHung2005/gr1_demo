spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/librarymanagement
spring.datasource.username=root
spring.datasource.password=hunghung26
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/library
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://127.0.0.1:8081/realms/library/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.audiences=library-api

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s

app.cache.books-ttl=30s
app.cache.statistics-ttl=15s
app.cache.key-prefix=library:v2:

app.kafka.enabled=${APP_KAFKA_ENABLED:true}
app.kafka.loan-topic=library.loan-events.v1
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
spring.kafka.admin.fail-fast=false
spring.kafka.admin.operation-timeout=5s
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties[enable.idempotence]=true
spring.kafka.producer.properties[max.block.ms]=2000
spring.kafka.producer.properties[request.timeout.ms]=3000
spring.kafka.producer.properties[delivery.timeout.ms]=10000
spring.kafka.consumer.group-id=library-loan-logger
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record
spring.kafka.listener.missing-topics-fatal=false

logging.level.org.hibernate.SQL=DEBUG
#spring.jpa.show-sql: true

spring.jpa.open-in-view=false
